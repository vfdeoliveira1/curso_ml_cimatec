[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reconhecimento_facial"
version = "0.0.1"
description = "Controle de acesso por reconhecimento facial com OpenCV e DeepFace."
authors = [
  { name = "Vinicius Oliveira" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "deepface",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "opencv-python>=4.10,<5",  # o OpenCV 5 removeu os Haar cascades usados pelo DeepFace
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tf-keras",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["reconhecimento_facial"]
include = ["pyproject.toml", "reconhecimento_facial/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["reconhecimento_facial"]
force-sort-within-sections = true


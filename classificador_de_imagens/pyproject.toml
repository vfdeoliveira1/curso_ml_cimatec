[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "classificador_de_imagens"
version = "0.0.1"
description = "Classificação de imagens CIFAR-10 com uma rede neural convolucional."
authors = [
  { name = "Vinicius Oliveira" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru>=0.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "python-dotenv>=1",
    "tensorflow>=2.16",
    "typer>=0.12",
]
requires-python = "~=3.12.0"

[dependency-groups]
dev = [
    "ipython",
    "jupyterlab",
    "mkdocs",
    "notebook",
    "pytest",
    "ruff",
]


[tool.ruff]
line-length = 99
src = ["classificador_de_imagens"]
include = ["pyproject.toml", "classificador_de_imagens/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["classificador_de_imagens"]
force-sort-within-sections = true
